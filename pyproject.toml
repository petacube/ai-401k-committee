[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai401k"
version = "1.0.0"
description = "AI-assisted 401k allocation (US/international equity, bonds, gold, cash ETFs) with monthly rebalancing driven by Claude Code"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ai401k = "ai401k.cli:main"

[tool.setuptools]
packages = ["ai401k"]

[tool.pytest.ini_options]
testpaths = ["tests"]
